<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Methodocs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500;600&family=Zilla+Slab:wght@500;600;700&display=swap">
<style>
/* Layout: a student's index-card box. Bristol cards (red margin line, blue ruling, coloured tabs) hold each method; ballpoint blue for actions. */
:root{
  --paper:#f3f5f9; --card:#ffffff; --card-2:#f8f9fc;
  --ink:#1b2130; --ink-2:#465068; --ink-3:#757d8e; --line:#d9dfe9; --line-2:#c3cbd8;
  --bic:#2347a6; --bic-ink:#ffffff; --bic-soft:#e5ebf8;
  --red:#cf4540; --rule:#c8d9ee;
  --t-mem:#d9e8f8; --t-org:#f8ecbd; --t-ent:#d7eedb; --t-ens:#f7dbe3;
  --t-mem-ink:#1f4e86; --t-org-ink:#7a5a00; --t-ent-ink:#1f6a3c; --t-ens-ink:#8e2f4f;
  --ok:#1f7a4a; --mid:#9a6400; --low:#7b8292; --warn-soft:#fdf3dc;
  --display:"Zilla Slab",Rockwell,"Roboto Slab",Georgia,serif;
  --text:"Commissioner","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Red Hat Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#10141c; --card:#191f2a; --card-2:#1e2532;
  --ink:#e7eaf0; --ink-2:#b6bdca; --ink-3:#8a92a2; --line:#2a3242; --line-2:#3a4457;
  --bic:#8eacff; --bic-ink:#0f1730; --bic-soft:#1f2a46;
  --red:#e2716c; --rule:#26354b;
  --t-mem:#1f3350; --t-org:#3a3218; --t-ent:#1d3627; --t-ens:#3c2230;
  --t-mem-ink:#a9c8f0; --t-org-ink:#e8c868; --t-ent-ink:#8fd6a8; --t-ens-ink:#f0a8c0;
  --ok:#6ccb95; --mid:#e3b25d; --low:#8a92a2; --warn-soft:#352b14;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#10141c; --card:#191f2a; --card-2:#1e2532;
  --ink:#e7eaf0; --ink-2:#b6bdca; --ink-3:#8a92a2; --line:#2a3242; --line-2:#3a4457;
  --bic:#8eacff; --bic-ink:#0f1730; --bic-soft:#1f2a46;
  --red:#e2716c; --rule:#26354b;
  --t-mem:#1f3350; --t-org:#3a3218; --t-ent:#1d3627; --t-ens:#3c2230;
  --t-mem-ink:#a9c8f0; --t-org-ink:#e8c868; --t-ent-ink:#8fd6a8; --t-ens-ink:#f0a8c0;
  --ok:#6ccb95; --mid:#e3b25d; --low:#8a92a2; --warn-soft:#352b14;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--text);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
a{color:var(--bic);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bic);outline-offset:2px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,1.4rem + 2.6vw,3.1rem)}
h2{font-size:1.6rem}
h3{font-size:1.2rem}
p{margin:0}
.muted{color:var(--ink-3)}
.small{font-size:.875rem}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.prose{max-width:66ch}
.stack{display:flex;flex-direction:column;gap:12px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px 20px;min-height:64px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:700;font-size:1.25rem;white-space:nowrap}
.brand svg{flex:none}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:8px 11px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:.95rem;white-space:nowrap}
nav.tabs a:hover{background:var(--card-2);color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--red);border-radius:6px 6px 0 0}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--red);color:#fff;font-size:.72rem;font-weight:700;margin-left:4px}
main{padding-block:28px 72px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:8px 16px;border-radius:8px;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink);font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--bic);border-color:var(--bic);color:var(--bic-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:.875rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--bic);padding-inline:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* bristol card */
.bristol{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 0 var(--line),0 6px 18px -12px rgba(20,30,60,.25);overflow:hidden}
.bristol.ruled{background-image:linear-gradient(var(--red),var(--red)),repeating-linear-gradient(to bottom,transparent 0 29px,var(--rule) 29px 30px);background-size:100% 2px,100% 100%;background-position:0 46px,0 47px;background-repeat:no-repeat,no-repeat;background-color:var(--card)}
.bristol.ruled.top-only{background-size:100% 2px,100% 168px}
.tab{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:3px}
.tab.mem{background:var(--t-mem);color:var(--t-mem-ink)}
.tab.org{background:var(--t-org);color:var(--t-org-ink)}
.tab.ent{background:var(--t-ent);color:var(--t-ent-ink)}
.tab.ens{background:var(--t-ens);color:var(--t-ens-ink)}
.tab.neutral{background:var(--card-2);color:var(--ink-2);border:1px solid var(--line)}

/* evidence meter */
.ev{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;color:var(--ink-2);white-space:nowrap}
.ev i{display:inline-flex;gap:2px}
.ev i b{width:6px;height:14px;border-radius:1px;background:var(--line-2)}
.ev.l3 i b{background:var(--ok)}
.ev.l2 i b:nth-child(-n+2){background:var(--mid)}
.ev.l1 i b:first-child{background:var(--low)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:12px 36px}
.hero p.lead{font-size:1.15rem;color:var(--ink-2);margin-top:16px;max-width:52ch}
.hero .row{margin-top:24px}
.feature{padding:18px 22px 22px}
.feature .head{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:28px}
.feature h3{margin-top:26px;font-size:1.45rem}
.feature p{margin-top:6px;color:var(--ink-2);line-height:30px}
.cycle{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;position:relative}
.cycle::before{content:"";position:absolute;left:12.5%;right:12.5%;top:17px;height:2px;background:var(--bic)}
.cycle div{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center}
.cycle b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--card);border:2px solid var(--bic);font-family:var(--mono);font-size:.8rem;color:var(--bic)}
.cycle div:first-child b{background:var(--bic);color:var(--bic-ink)}
.cycle span{font-size:.78rem;color:var(--ink-3);line-height:1.3}

.entries{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:8px}
.entry{display:flex;flex-direction:column;gap:8px;padding:18px;text-decoration:none;color:var(--ink);border-top:4px solid var(--line)}
.entry:hover{border-color:var(--ink-3)}
.entry.mem{border-top-color:var(--t-mem-ink)}.entry.org{border-top-color:var(--t-org-ink)}.entry.ent{border-top-color:var(--t-ent-ink)}.entry.ens{border-top-color:var(--t-ens-ink)}
.entry h3{font-size:1.15rem}
.entry p{font-size:.92rem;color:var(--ink-2)}
.entry .count{font-family:var(--mono);font-size:.78rem;color:var(--ink-3);margin-top:auto}

.section{margin-top:48px}
.section>h2{margin-bottom:6px}
.section>.sub{color:var(--ink-2);margin-bottom:18px}
.principles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:16px}
.principles div{border-left:2px solid var(--red);padding-left:14px}
.principles h3{font-size:1.05rem;margin-bottom:4px}
.principles p{font-size:.92rem;color:var(--ink-2)}

/* page head */
.phead{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.phead p{color:var(--ink-2);max-width:66ch}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;border:1.5px solid var(--line-2);background:var(--card);cursor:pointer;font-size:.88rem;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.search{min-height:42px;padding:8px 12px;border:1.5px solid var(--line-2);border-radius:8px;background:var(--card);width:min(320px,100%)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px}

/* method grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.mcard{display:flex;flex-direction:column;gap:10px;padding:16px 18px 18px;text-decoration:none;color:var(--ink);min-width:0}
.mcard .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mcard h3{font-size:1.2rem;margin-top:4px}
.mcard p{color:var(--ink-2);font-size:.95rem}
.mcard .foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.mcard:hover{border-color:var(--line-2)}
.empty{padding:28px;text-align:center;color:var(--ink-3);border:1.5px dashed var(--line-2);border-radius:6px}

/* fiche detail */
.back{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;font-weight:600;text-decoration:none;margin-bottom:14px}
.fiche{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:32px;align-items:start}
.fiche-card{padding:18px 26px 28px}
.fiche-card .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:28px}
.fiche-card h1{margin-top:26px;font-size:clamp(1.8rem,1.4rem + 1.6vw,2.4rem);line-height:1.2}
.fiche-card .bref{margin-top:12px;font-size:1.12rem;line-height:30px;color:var(--ink-2)}
.block{margin-top:30px}
.block h2{font-size:1.25rem;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bic);color:var(--bic);font-family:var(--mono);font-size:.78rem;margin-top:1px}
ul.dash{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ul.dash li::marker{color:var(--red)}
.study{padding:14px 16px;border-radius:6px;background:var(--card-2);border:1px solid var(--line)}
.study+.study{margin-top:10px}
.study .who{font-family:var(--mono);font-size:.78rem;color:var(--ink-3);margin-bottom:4px}
.study p{font-size:.95rem}
sup a{font-family:var(--mono);font-size:.72rem;text-decoration:none;margin-left:2px}
.aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.aside .box{padding:16px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.aside .box h3{font-size:1rem;margin-bottom:8px}
.aside a.rel{display:block;padding:6px 0;text-decoration:none;font-weight:500;border-top:1px dashed var(--line)}
.aside a.rel:first-of-type{border-top:0}
ol.src{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:.88rem;color:var(--ink-2)}
ol.src li{overflow-wrap:anywhere}
.legend{display:flex;flex-direction:column;gap:8px;font-size:.85rem}

/* tools */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tool{display:flex;flex-direction:column;gap:10px;padding:18px;min-width:0}
.tool .meta{display:flex;gap:6px;flex-wrap:wrap}
.tool p{color:var(--ink-2);font-size:.95rem}
.tool .row{margin-top:auto;padding-top:6px}
.tool.featured{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding:22px}
.tag{display:inline-flex;align-items:center;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--card-2);border:1px solid var(--line);color:var(--ink-2)}
.tag.free{background:var(--t-ent);border-color:transparent;color:var(--t-ent-ink)}
.tag.part{background:var(--warn-soft);border-color:transparent;color:var(--mid)}

/* tutorial */
.tabsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tabsgrid .t{padding:14px 16px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.tabsgrid .t b{display:block;font-family:var(--display);font-size:1.08rem;margin-bottom:4px}
.tabsgrid .t p{font-size:.9rem;color:var(--ink-2)}
.notice{padding:14px 16px;border-radius:6px;background:var(--bic-soft);color:var(--ink);font-size:.95rem}
.notice.warn{background:var(--warn-soft)}
.scale{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px;max-width:520px}
.scale div{padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--card);text-align:center}
.scale b{display:block;font-family:var(--mono);font-size:1.1rem;color:var(--bic)}
.scale span{font-size:.8rem;color:var(--ink-3)}
.tablewrap{overflow-x:auto}

/* board */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
.post{padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.post .meta{display:flex;gap:6px;flex-wrap:wrap}
.post p{overflow-wrap:anywhere}
.post .contact{font-family:var(--mono);font-size:.88rem;padding:6px 10px;background:var(--card-2);border-radius:4px;user-select:all;overflow-wrap:anywhere}
.retour dl{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:6px 16px;margin:6px 0 0}
.retour dt{font-weight:600;font-size:.9rem;color:var(--ink-2)}
.retour dd{margin:0;overflow-wrap:anywhere}

/* forms */
form.f{display:flex;flex-direction:column;gap:16px;padding:22px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:600;font-size:.95rem}
.field .hint{font-size:.85rem;color:var(--ink-3)}
.field input,.field select,.field textarea{min-height:44px;padding:9px 12px;border:1.5px solid var(--line-2);border-radius:8px;background:var(--card);width:100%;max-width:100%}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.types label{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line-2);border-radius:8px;cursor:pointer;background:var(--card);font-weight:500;font-size:.92rem}
.types input{margin-top:4px;accent-color:var(--bic)}
.types label:has(input:checked){border-color:var(--bic);box-shadow:inset 0 0 0 1px var(--bic)}
.ok{padding:14px 16px;border-radius:6px;background:var(--t-ent);color:var(--t-ent-ink);font-weight:500}
.err{padding:12px 14px;border-radius:6px;background:var(--warn-soft);color:var(--ink)}
.mine{display:flex;flex-direction:column;gap:8px}
.mine .it{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);font-size:.9rem;flex-wrap:wrap}
.st{font-family:var(--mono);font-size:.75rem;padding:2px 8px;border-radius:3px;white-space:nowrap}
.st.wait{background:var(--warn-soft);color:var(--mid)}
.st.pub{background:var(--t-ent);color:var(--t-ent-ink)}
.st.no{background:var(--card-2);color:var(--ink-3)}

/* review */
.rv{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.rv dl{display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr);gap:4px 14px;margin:0;font-size:.92rem}
.rv dt{color:var(--ink-3)}
.rv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}

.charte{counter-reset:c;display:flex;flex-direction:column;gap:18px;list-style:none;padding:0;margin:0}
.charte li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px}
.charte li::before{counter-increment:c;content:counter(c);font-family:var(--display);font-weight:700;font-size:1.6rem;color:var(--red);line-height:1}
.charte h3{font-size:1.1rem;margin-bottom:4px}
.charte p{color:var(--ink-2)}

footer{border-top:1px solid var(--line);padding-block:22px;color:var(--ink-3);font-size:.85rem}


/* ===== Mise en page v2 : plus d'air, moins d'éléments par carte, une hiérarchie nette ===== */
body{font-size:17px;line-height:1.65}
.wrap{max-width:1120px}
main{padding-block:44px 104px}
h1{font-size:clamp(2.2rem,1.4rem + 3vw,3.5rem);letter-spacing:-.01em}
h2{font-size:clamp(1.5rem,1.2rem + 1vw,1.9rem)}
.top .wrap{min-height:70px}
nav.tabs{justify-content:center;gap:4px}
nav.tabs a{padding:8px 13px;font-size:.98rem}
.btn{min-height:46px;padding:10px 20px;border-radius:10px;font-size:1rem}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.92rem}

/* Accueil */
.hero{gap:56px;padding-block:24px 64px}
.hero h1{font-size:clamp(2.4rem,1.5rem + 3.4vw,3.9rem);line-height:1.08}
.hero p.lead{font-size:1.2rem;margin-top:20px;max-width:44ch}
.hero .row{margin-top:30px;gap:12px}
.feature{padding:22px 26px 28px}
.doors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.door{display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;padding:22px 22px 20px;text-decoration:none;color:var(--ink);min-height:230px}
.door .ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--tc);color:var(--ti)}
.door .ico svg{width:26px;height:26px}
.door.mem{--tc:var(--t-mem);--ti:var(--t-mem-ink)}.door.org{--tc:var(--t-org);--ti:var(--t-org-ink)}.door.ent{--tc:var(--t-ent);--ti:var(--t-ent-ink)}.door.ens{--tc:var(--t-ens);--ti:var(--t-ens-ink)}
.door h3{font-size:1.35rem;margin-top:6px}
.door p{color:var(--ink-2);font-size:.97rem}
.door .count{font-family:var(--mono);font-size:.8rem;color:var(--ti);display:flex;justify-content:space-between;align-items:center}

function readForm(form){ var o={}; Array.prototype.forEach.call(form.elements,function(el){ if(el.name) o[el.name]=el.value.trim(); }); return o; }

async function submit(form,type,spec){

async function decide(it,statut,btn){
  btn.disabled=true;
  try{

      var c=Object.assign({},it.e.champs);
      if(it.e.type!=="annonce") delete c.contact;
      await S.db.doc("publie/"+it.e.id).set({type:it.e.type,champs:c,publieLe:new Date().toISOString()});
    }
    var ref=S.db.doc("file/"+it.owner); var snap=await ref.get(); var d=snap.data()||{};
    var envois=(d.envois||[]).map(function(x){ return x.id===it.e.id? Object.assign({},x,{statut:statut,decide:new Date().toISOString()}) : x; });
    await ref.update({envois:envois});

  else v=viewAccueil();
  var focused=document.activeElement&&document.activeElement.id;
  app.replaceChildren(v);
  if(focused&&document.getElementById(focused)) { var el=document.getElementById(focused); el.focus(); if(el.setSelectionRange&&el.value) try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){} }
}
var lastRoute=route();
window.addEventListener("hashchange",function(){ var r=route(); if(r!==lastRoute){ S.sent=null; S.err=null; lastRoute=r; render(); window.scrollTo(0,0); } });

/* Re-render on new shared data, except while someone is filling in a form */
function soft(){ if(route().indexOf("proposer")===0) renderNav(); else render(); }
/* ================= Données partagées ================= */
async function boot(){
  render();
  var c=window.claude; if(!c||typeof c.use!=="function"){ S.dbState="off"; render(); return; }
  try{
    var both=await Promise.all([c.use("user").catch(function(){return null}), c.use("db").catch(function(){return null})]);
    var u=both[0], db=both[1];
    if(u){ S.user=u;
      try{ S.owner=!!(await u.isOwner()); }catch(e){}
      try{ S.admin=S.owner||!!(await u.canEdit()); }catch(e){}
      try{ S.canWrite=await u.can("data.write"); }catch(e){}
      try{ S.uid=await u.id(); }catch(e){}
    }
    if(!db){ S.dbState="off"; render(); return; }
    S.db=db; S.dbState="on"; render();
    db.collection("publie").onSnapshot(function(snap){ S.publie=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())}); S.gotPublie=true; soft(); }, function(){ S.gotPublie=true; soft(); });
    if(S.uid) db.doc("file/"+S.uid).onSnapshot(function(d){ S.mine=d.exists? ((d.data()||{}).envois||[]) : []; if(route().indexOf("proposer")===0) render(); }, function(){});
    if(S.admin) db.collection("file").onSnapshot(function(snap){ S.queue=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())}); if(route()==="relecture") render(); else renderNav(); }, function(){});
  }catch(e){ S.dbState="off"; render(); }
}
